name: Vérifications VYRA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests API et contrôle JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances et outils de test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Vérifier la compilation Python
        run: python -m compileall -q app

      - name: Exécuter les tests simulés FastAPI
        run: pytest -q

      - name: Vérifier la syntaxe JavaScript
        run: node --check app/static/app.js
